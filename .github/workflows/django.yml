name: Frontend + Django integration
on: [push, pull_request]
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allmanager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        # Runner options are not parsed by a shell: single quotes do not group arguments.
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/allmanager
      DATA_SOURCE: django
      ALLOW_MOCK_AUTH: '0'
      DJANGO_API_URL: http://127.0.0.1:8000/api/v1
      DEMO_ENVIRONMENT: '0'
      PROVISION_PASSWORD: local-e2e-password-only
      E2E_MODE: django
      E2E_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ibrodevs/AI-Manager-backend
          # Tested backend source; update explicitly with the paired backend PR.
          ref: 39d79d7e41fe0c511de3788179013c29b7e9ed41
          path: .backend
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r .backend/requirements.txt
      - name: Verify PostgreSQL connection before tests
        run: |
          python - <<'PYTHON'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=5) as conn:
              assert conn.execute("SELECT 1").fetchone() == (1,)
              print("PostgreSQL connection verified")
          PYTHON
      - run: python .backend/manage.py test core --noinput
      - run: python .backend/manage.py makemigrations --check --dry-run
      - run: python .backend/manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm --filter @all/web exec tsx ../../scripts/export-backend-questionnaire.ts --output ../../.backend/core/questionnaire.json --check
      - run: pnpm --filter @all/web exec playwright install --with-deps chromium
      - run: python .backend/manage.py migrate && python .backend/manage.py seed_demo
      - name: Prepare unprivileged API role
        run: python .backend/scripts/ci-runtime-db.py
      - run: |
          DATABASE_URL=postgresql://allmanager_runtime:ci-runtime-only@localhost:5432/allmanager python .backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/django.log 2>&1 &
          pnpm --filter @all/web dev > /tmp/web.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ && curl -fsS http://localhost:3000/login > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/django.log /tmp/web.log
            exit 1
          fi
          pnpm --filter @all/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: django-browser-traces
          path: |
            apps/web/test-results
            /tmp/django.log
            /tmp/web.log
